---
- name: Build Mainsail locally
  delegate_to: localhost
  block:
    - name: Clone mainsail repository
      git:
        repo: "{{ mainsail_repo }}"
        dest: "{{ mainsail_local_build_dir }}"
        version: "{{ mainsail_version }}"
        force: yes

    - name: Apply Mainsail patches
      patch:
        src: "{{ item }}"
        basedir: "{{ mainsail_local_build_dir }}"
        strip: 1
      loop:
        - disable_service_worker.patch
        - multiple_hostnames.patch

    - name: Prepare mainsail dependencies
      command: npm ci
      args:
        chdir: "{{ mainsail_local_build_dir }}"

    - name: Build mainsail
      command: npm run build
      args:
        chdir: "{{ mainsail_local_build_dir }}"

- name: Create mainsail www folder
  become: true
  file:
    path: "{{ mainsail_www_dir }}"
    state: directory
    owner: "{{ system_user }}"
    group: www-data

- name: Copy mainsail files to www dir
  unarchive:
    src: "{{ mainsail_local_build_dir }}/dist/mainsail.zip"
    dest: "{{ mainsail_www_dir }}"

- name: Copy Mainsail config.json
  template:
    src: config.json.j2
    dest: "{{ mainsail_www_dir }}/config.json"

- name: Copy nginx config for mainsail
  become: true
  template:
    src: "{{ item.src }}.j2"
    dest: "/etc/nginx/{{ item.dest }}"
  loop:
    - { src: nginx_common_vars.conf, dest: conf.d/common_vars.conf }
    - { src: nginx_upstreams.conf, dest: conf.d/upstreams.conf }
    - { src: nginx_mainsail.conf, dest: sites-available/mainsail }
  notify: reload nginx

- name: Remove nginx default site
  become: true
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Link mainsail nginx config to enable sites
  become: true
  file:
    src: /etc/nginx/sites-available/mainsail
    dest: /etc/nginx/sites-enabled/mainsail
    state: link
  notify: reload nginx
