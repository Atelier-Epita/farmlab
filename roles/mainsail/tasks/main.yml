---
- name: Build Mainsail locally
  delegate_to: localhost
  block:
    - name: Clone mainsail repository
      git:
        repo: "{{ mainsail_repo }}"
        dest: "{{ mainsail_local_build_dir }}"
        version: "{{ mainsail_version }}"
        force: yes

    - name: Apply Mainsail patches
      patch:
        src: "{{ item }}"
        basedir: "{{ mainsail_local_build_dir }}"
        strip: 1
      loop:
        - disable_service_worker.patch
        - multiple_hostnames.patch

    - name: Prepare mainsail dependencies
      command: npm install
      args:
        chdir: "{{ mainsail_local_build_dir }}"

    - name: Build mainsail
      command: npm run build
      args:
        chdir: "{{ mainsail_local_build_dir }}"

- name: Create mainsail www folder
  become: true
  file:
    path: "{{ mainsail_www_dir }}"
    state: directory
    owner: "{{ system_user }}"
    group: www-data

- name: Copy mainsail files to www dir
  unarchive:
    src: "{{ mainsail_local_build_dir }}/dist/mainsail.zip"
    dest: "{{ mainsail_www_dir }}"

- name: Copy Mainsail config.json
  template:
    src: config.json.j2
    dest: "{{ mainsail_www_dir }}/config.json"

- name: Copy nginx config for mainsail
  become: true
  template:
    src: "{{ item.src }}.j2"
    dest: "/etc/nginx/{{ item.dest }}"
  loop:
    - { src: nginx_common_vars.conf, dest: conf.d/common_vars.conf }
    - { src: nginx_upstreams.conf, dest: conf.d/upstreams.conf }
    - { src: nginx_mainsail.conf, dest: sites-available/mainsail }
  notify: reload nginx

- name: Remove nginx default site
  become: true
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Link mainsail nginx config to enable sites
  become: true
  file:
    src: /etc/nginx/sites-available/mainsail
    dest: /etc/nginx/sites-enabled/mainsail
    state: link
  notify: reload nginx

- name: Set Mainsail printer names
  uri:
    url: "http://{{ item.moonraker.host | default('127.0.0.1') }}:{{ item.moonraker.port }}/server/database/item"
    method: POST
    body_format: json
    body:
      namespace: mainsail
      key: general.printername
      value: "{{ item.display_name }}"
  loop: "{{ printers }}"
  changed_when: true
  tags: ['mainsail_metadata']

- name: Set remote printer cameras
  uri:
    url: "http://{{ item.moonraker.host }}:{{ item.moonraker.port }}/server/webcams/item"
    method: POST
    body_format: json
    body:
      name: "{{ item.name }}"
      enabled: true
      service: webrtc-go2rtc
      stream_url: "/webcam/stream.html?src={{ item.name }}"
      snapshot_url: "/webcam/api/frame.jpeg?src={{ item.name }}"
  loop: "{{ printers }}"
  when:
    - item.camera is defined
    - not (item.managed | default(true) | bool)
  changed_when: true
  tags: ['mainsail_metadata']

- name: Configure remote displays
  import_tasks: remote_display.yml

- name: Configure remote printer themes
  import_tasks: theme.yml
