- name: Copy config for {{ printer.name }}
  template:
    src: "{{ item.src }}"
    dest: "{{ install_dir }}/printer_data_{{ printer.name }}/config/{{ item.dest }}"
    backup: "{{ item.dest == 'printer.cfg' }}"
  loop:
    - src: "{{ printer.macros_template | default('macros.cfg.j2') }}"
      dest: macros.cfg
    - src: mainsail.cfg.j2
      dest: mainsail.cfg
    - src: "{{ printer.model }}.cfg.j2"
      dest: "{{ printer.model }}.cfg"
    - src: "{{ printer.name }}.cfg.j2"
      dest: "{{ printer.name }}.cfg"
    - src: printer.cfg.j2
      dest: printer.cfg
  register: cfg_templates

- name: Restart klipper for {{ printer.name }}
  become: true
  systemd:
    name: "klipper@{{ printer.name }}"
    state: restarted
  when: cfg_templates.changed

- name: Copy mainsail theme for {{ printer.name }}
  copy:
    src: "{{ item }}"
    dest: "{{ install_dir }}/printer_data_{{ printer.name }}/config/.theme/{{ item }}"
  loop:
    - sidebar-logo.png
    - favicon-32x32.png
    - favicon-16x16.png
