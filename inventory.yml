all:
  vars:
    cors_domains:
      - "https://farmlab.lemaker.fr"
      - "http://farmlab"
      - "http://{{ inventory_hostname }}.local"

    system_user: pi
    install_dir: "/home/{{ system_user }}"

    klipper_repo: "https://github.com/Klipper3d/klipper"
    klipper_version: "v0.13.0"

    moonraker_repo: "https://github.com/Arksine/moonraker"
    moonraker_version: "1ed102edfb34906115bfeb02712d4c839b93a7a9"

    mainsail_repo: "https://github.com/mainsail-crew/mainsail"
    mainsail_version: "v2.17.0"
    mainsail_www_dir: "/var/www/mainsail"
    mainsail_local_build_dir: "./mainsail-build"

    go2rtc_version: "v1.9.14"
    stun_server: "stuns:ice.ldryt.dev:5349"
    turn_server: "turns:ice.ldryt.dev:5349"
    turn_user: "farmlab_atelier_epita"
    turn_password_file: "{{ install_dir }}/ice.ldryt.dev.txt"

  hosts:
    farmlab:
      printers:
        - name: artillery_1
          display_name: "Artillery Sidewinder X1 #1"
          model: artillery_sidewinder_x1
          mcus:
            main: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.4.4:1.0-port0
          camera: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.2:1.0-video-index0
          moonraker:
            port: 7125
        - name: artillery_2
          display_name: "Artillery Sidewinder X1 #2"
          model: artillery_sidewinder_x1
          mcus:
            main: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.4.3:1.0-port0
          camera: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.1:1.0-video-index0
          moonraker:
            port: 7126
        - name: wanhao
          display_name: "Wanhao Duplicator 12/300"
          model: wanhao_duplicator_12_300
          mcus:
            main: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.4.1:1.0-port0
          moonraker:
            port: 7128
        - name: voron_lucas.ladreyt
          display_name: "Voron 0.2 (lucas.ladreyt)"
          model: voron_0_2_skr_pico
          macros_template: voron_0_2_macros.cfg.j2
          mcus:
            main: /dev/serial/by-id/usb-Klipper_rp2040_4550357129107B88-if00
            expander: /dev/serial/by-id/usb-Klipper_stm32f042x6_020024001643305645303820-if00
          camera: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2.3:1.0-video-index0
          moonraker:
            port: 7129
        - name: kobra_3
          display_name: "Anycubic Kobra 3 + ACE Pro"
          managed: false
          rinkhals:
            mqtt_print_auto_leveling: true
            mqtt_print_vibration_compensation: true
            mqtt_print_flow_calibration: true
          moonraker:
            host: 10.69.3.162
            port: 7125
